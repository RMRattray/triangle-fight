<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship Game</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #02030a; color: white; font-family: sans-serif; }
      canvas { display: block; cursor: crosshair; }
      #instructions { position: fixed; top: 16px; left: 16px; user-select: none; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="instructions">Point with the mouse • Hold Space to thrust</div>
    <script src="/interface.js"></script>
    <script src="/game.js"></script>
  </body>
</html>
