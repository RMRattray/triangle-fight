<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#000"/>

  <!-- Blue flame behind the southwest-facing base. -->
  <path d="M20 44 L4 60 L27 50 Z" fill="#1fa8ff"/>
  <path d="M20 44 L11 54 L24 48 Z" fill="#bcecff"/>

  <!-- Red laser continuing from the northeast-facing nose. -->
  <path d="M45.5 18.5 L60 4" stroke="#ff1e2d" stroke-width="4" stroke-linecap="round"/>
  <path d="M45.5 18.5 L60 4" stroke="#ff9aa2" stroke-width="1.25" stroke-linecap="round"/>

  <!-- 2:1 isosceles triangular spaceship, rotated toward the top right. -->
  <path d="M45.5 18.5 L26.4 50.4 L13.6 37.6 Z" fill="#fff" stroke="#dcecff" stroke-width="2" stroke-linejoin="round"/>
</svg>
